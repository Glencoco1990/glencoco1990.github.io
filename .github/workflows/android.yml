name: Build SpyScan APK

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../spyscan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: spyscan-apk
          path: spyscan.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SpyScan (latest build)
          body: |
            ดาวน์โหลด spyscan.apk แล้วติดตั้งบนมือถือ Android (8.0 ขึ้นไป)
            Built from ${{ github.sha }}
          files: spyscan.apk
          make_latest: true
          prerelease: false
